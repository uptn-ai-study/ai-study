<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>크립토 우물</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06060F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @keyframes coinFall {
      0%   { transform: translate(-50%, 0) scale(1); opacity: 1; }
      75%  { transform: translate(-50%, 120px) scale(0.6); opacity: 0.7; }
      100% { transform: translate(-50%, 155px) scale(0); opacity: 0; }
    }
    @keyframes ripple {
      0%   { transform: scale(0.1); opacity: 0.9; }
      100% { transform: scale(4); opacity: 0; }
    }
    @keyframes cardIn {
      0%   { transform: perspective(600px) rotateY(-90deg) scale(0.8); opacity: 0; }
      65%  { transform: perspective(600px) rotateY(6deg) scale(1.02); opacity: 1; }
      100% { transform: perspective(600px) rotateY(0) scale(1); opacity: 1; }
    }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes wellGlow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.35; }
      40%       { transform: translateY(-7px) translateX(3px); opacity: 0.7; }
      70%       { transform: translateY(3px) translateX(-5px); opacity: 0.45; }
    }
    @keyframes textFade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.15; }
      50%       { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .orb1      { animation: orbFloat 3.2s ease-in-out infinite; }
      .orb2      { animation: orbFloat 4.1s ease-in-out 1.1s infinite; }
      .orb3      { animation: orbFloat 3.7s ease-in-out 0.6s infinite; }
      .well-glow { animation: wellGlow 2.4s ease-in-out infinite; }
      .spin      { animation: spin 0.9s linear infinite; }
    }

    .scene {
      background: #0A0C16;
      border-radius: 20px;
      padding: 18px 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
      min-height: 520px;
      position: relative;
      overflow: hidden;
    }

    /* Stars */
    .stars { position: absolute; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #7B68EE;
      border-radius: 50%;
      opacity: 0.3;
    }

    /* Top bar */
    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .sc-title { font-size: 13px; color: #8B7EC4; font-weight: 500; }
    .pts {
      background: #141428;
      border: 0.5px solid #2E2A50;
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 12px;
      color: #BEB0F0;
    }

    /* Hint */
    .hint {
      font-size: 12px;
      color: #4D4478;
      text-align: center;
      margin: 10px 0 18px;
      line-height: 1.5;
    }

    /* Well */
    .well-area {
      position: relative;
      width: 180px;
      height: 210px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }
    .well-outer {
      position: absolute;
      bottom: 0;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: #1E1B30;
      border: 2.5px solid #2E2A50;
    }
    .well-mid {
      position: absolute;
      bottom: 10px;
      width: 148px; height: 148px;
      border-radius: 50%;
      background: #151222;
      border: 2px solid #252240;
      left: 50%;
      transform: translateX(-50%);
    }
    .well-void {
      position: absolute;
      bottom: 20px;
      width: 104px; height: 104px;
      border-radius: 50%;
      background: #06060F;
      border: 1.5px solid #1A1730;
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .well-glow {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: #3D2FA0;
      position: absolute;
    }
    .orb1 { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #7B68EE; top: 18px; left: 25px; }
    .orb2 { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #9B8EC4; bottom: 22px; right: 18px; }
    .orb3 { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #5550C0; top: 55px; right: 22px; }
    .well-stone1 {
      position: absolute;
      bottom: 155px; left: 26px;
      width: 22px; height: 14px;
      background: #1E1B30;
      border-radius: 3px;
      border: 0.5px solid #2E2A50;
    }
    .well-stone2 {
      position: absolute;
      bottom: 155px; right: 26px;
      width: 18px; height: 14px;
      background: #1E1B30;
      border-radius: 3px;
      border: 0.5px solid #2E2A50;
    }

    /* Coin */
    .coin-el {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #F5C842;
      border: 2px solid #C49A2A;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 10;
    }
    .coin-el.go { opacity: 1; animation: coinFall 0.65s ease-in forwards; }

    /* Ripple */
    .ripple-wrap {
      position: absolute;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 40px;
    }
    .rring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid #7B68EE;
      opacity: 0;
    }
    .rring.go                  { animation: ripple 0.9s ease-out forwards; }
    .rring:nth-child(2).go     { animation-delay: 0.2s; }
    .rring:nth-child(3).go     { animation-delay: 0.4s; }

    /* Button area */
    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .throw-btn {
      background: #2E2060;
      color: #D4C8FF;
      border: 0.5px solid #5048A0;
      border-radius: 28px;
      padding: 13px 32px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 220px;
    }
    .throw-btn:hover    { background: #3D2FA0; }
    .throw-btn:active   { transform: scale(0.97); }
    .throw-btn:disabled { opacity: 0.35; cursor: default; }
    .cost-hint { font-size: 11px; color: #3D3468; }

    /* Loading */
    .loading-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px 0;
    }
    .loading-wrap.show { display: flex; animation: textFade 0.3s ease-out; }
    .spin-ring {
      width: 34px; height: 34px;
      border: 2px solid #1E1B30;
      border-top-color: #7B68EE;
      border-radius: 50%;
    }
    .load-text  { font-size: 13px; color: #8B7EC4; }
    .load-dots  { color: #5048A0; letter-spacing: 3px; }

    /* Result */
    .result-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .result-wrap.show { display: flex; animation: cardIn 0.7s ease-out forwards; }

    .talisman {
      width: 190px;
      background: #F5E6A3;
      border-radius: 12px;
      border: 2px solid #C49A2A;
      padding: 20px 16px 18px;
      text-align: center;
      position: relative;
    }
    .t-inner {
      position: absolute;
      inset: 5px;
      border: 1px solid #C49A2A;
      border-radius: 8px;
      opacity: 0.4;
      pointer-events: none;
    }
    .t-label  { font-size: 9px; color: #8B6914; letter-spacing: 0.12em; font-weight: 500; margin-bottom: 8px; }
    .t-symbol { font-size: 32px; margin-bottom: 8px; }
    .t-grade  {
      font-size: 10px;
      color: #A05010;
      font-weight: 500;
      border: 1px solid #C49A2A;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      background: #FFF3CC;
    }
    .t-main { font-size: 13px; color: #3A1C00; font-weight: 500; line-height: 1.7; margin-bottom: 6px; white-space: pre-line; }
    .t-sub  { font-size: 11px; color: #7A5020; line-height: 1.5; white-space: pre-line; }

    .again-btn {
      background: transparent;
      color: #6B5E9A;
      border: 0.5px solid #2E2A50;
      border-radius: 20px;
      padding: 8px 24px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .again-btn:hover { border-color: #5048A0; color: #9B8EC4; }

    /* Daily-used badge */
    .daily-badge {
      font-size: 11px;
      color: #4D4478;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="scene">
  <div class="stars" id="stars"></div>

  <div class="topbar">
    <span class="sc-title">🪙 크립토 우물</span>
    <span class="pts" id="pts-display">1,240 UP</span>
  </div>
  <div class="hint" id="hint-text">
    1년 반 동안 신비로운 기운이 고인 우물<br>
    동전을 던지면 오늘의 투자 부적을 알려줄게
  </div>

  <div class="well-area" id="well-area">
    <div class="well-outer"></div>
    <div class="well-mid"></div>
    <div class="well-stone1"></div>
    <div class="well-stone2"></div>
    <div class="well-void">
      <div class="well-glow"></div>
      <div class="orb1"></div>
      <div class="orb2"></div>
      <div class="orb3"></div>
    </div>
    <div class="coin-el" id="coin">🪙</div>
    <div class="ripple-wrap">
      <div class="rring" id="r1"></div>
      <div class="rring" id="r2"></div>
      <div class="rring" id="r3"></div>
    </div>
  </div>

  <div class="btn-wrap" id="btn-area">
    <button class="throw-btn" id="throw-btn" onclick="throwCoin()">10 UP 던지기 🪙</button>
    <span class="cost-hint" id="cost-hint">잔여 1,240 UP · 하루 1회</span>
  </div>

  <div class="loading-wrap" id="loading-area">
    <div class="spin-ring spin"></div>
    <div class="load-text">우물이 운명을 읽는 중<span class="load-dots" id="dots">...</span></div>
  </div>

  <div class="result-wrap" id="result-area">
    <div class="talisman" id="talisman-card">
      <div class="t-inner"></div>
      <div class="t-label">오늘의 투자 부적</div>
      <div class="t-symbol" id="t-symbol">₿</div>
      <div class="t-grade"  id="t-grade">대길 (大吉)</div>
      <div class="t-main"   id="t-main">손이 가벼운 자는\n수익을 보지 못하리라</div>
      <div class="t-sub"    id="t-sub">오늘은 차트를 닫고 기다려라.\nHODL이 곧 부적이니라.</div>
    </div>
    <button class="again-btn" onclick="resetWell()">← 우물로 돌아가기</button>
  </div>
</div>

<script>
  const COST = 10;
  const STORAGE_KEY = 'crypto_well';

  const talismans = [
    { symbol: '₿',  grade: '대길 (大吉)', main: '손이 가벼운 자는\n수익을 보지 못하리라',      sub: '오늘은 차트를 닫고 기다려라.\nHODL이 곧 부적이니라.' },
    { symbol: '📉', grade: '흉 (凶)',      main: '오늘 매수를 서두르면\n후회가 따르리라',         sub: '하락장에서 줍줍하는 자여.\n내일을 기다리라.' },
    { symbol: '🌙', grade: '길 (吉)',      main: '새벽 3시 차트를 보는 자에게\n행운이 깃드나니',  sub: '오늘 밤은 폰을 내려놓을 것.\n달이 뜨면 코인도 뜨리라.' },
    { symbol: '⚡', grade: '대길 (大吉)', main: '분할매수는 하늘의 뜻\n한 번에 올인은 금물이니라', sub: '오늘은 세 번에 나눠 매수하라.\n리스크가 곧 적이니라.' },
    { symbol: '🔮', grade: '평 (平)',      main: '오르는 것은 반드시 내리고\n내리는 것은 반드시 오르나니', sub: '흔들리지 말고 믿어라.\n네 포트폴리오는 살아있다.' },
    { symbol: '🪨', grade: '길 (吉)',      main: '돌같이 굳건한 마음으로\n버티는 자가 승리하나니',  sub: '오늘 하루 손절 금지.\n돌멩이처럼 무거워져라.' },
    { symbol: '💎', grade: '대길 (大吉)', main: '다이아몬드 핸드만이\n다음 불장을 맞이하리라',    sub: '팔려는 손을 거두어라.\n빛나는 날이 온다.' },
    { symbol: '🌊', grade: '흉 (凶)',      main: '파도가 높을수록\n휩쓸리는 자가 생기나니',        sub: '오늘은 신중히 관망하라.\n변동성이 클 것이니라.' },
  ];

  function getToday() {
    return new Date().toDateString();
  }

  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { pts: 1240, lastUsed: null };
    } catch { return { pts: 1240, lastUsed: null }; }
  }

  function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  let state = loadState();

  function syncUI() {
    document.getElementById('pts-display').textContent = state.pts.toLocaleString() + ' UP';
    document.getElementById('cost-hint').textContent =
      `잔여 ${state.pts.toLocaleString()} UP · 하루 1회`;

    const usedToday = state.lastUsed === getToday();
    const btn = document.getElementById('throw-btn');
    btn.disabled = usedToday || state.pts < COST;
    if (usedToday) btn.textContent = '오늘 이미 사용함 ✓';
    else btn.textContent = `${COST} UP 던지기 🪙`;
  }

  let dotsInterval;

  function animateDots() {
    const el = document.getElementById('dots');
    let i = 0;
    const d = ['', '.', '..', '...'];
    dotsInterval = setInterval(() => { el.textContent = d[i++ % 4]; }, 400);
  }

  function showResult() {
    clearInterval(dotsInterval);

    const seed = getToday() + 'well';
    const idx = hashCode(seed) % talismans.length;
    const t = talismans[idx];

    document.getElementById('t-symbol').textContent = t.symbol;
    document.getElementById('t-grade').textContent  = t.grade;
    document.getElementById('t-main').textContent   = t.main;
    document.getElementById('t-sub').textContent    = t.sub;

    document.getElementById('loading-area').classList.remove('show');
    document.getElementById('result-area').classList.add('show');
  }

  function throwCoin() {
    if (state.pts < COST || state.lastUsed === getToday()) return;

    const coin = document.getElementById('coin');
    document.getElementById('throw-btn').disabled = true;

    coin.classList.add('go');
    setTimeout(() => {
      ['r1', 'r2', 'r3'].forEach(id => document.getElementById(id).classList.add('go'));
    }, 500);

    setTimeout(() => {
      document.getElementById('btn-area').style.display   = 'none';
      document.getElementById('well-area').style.display  = 'none';
      document.getElementById('hint-text').style.display  = 'none';
      document.getElementById('loading-area').classList.add('show');
      animateDots();
    }, 900);

    setTimeout(() => {
      state.pts -= COST;
      state.lastUsed = getToday();
      saveState(state);
      showResult();
    }, 2700);
  }

  function resetWell() {
    const coin = document.getElementById('coin');
    coin.classList.remove('go');
    ['r1', 'r2', 'r3'].forEach(id => document.getElementById(id).classList.remove('go'));
    document.getElementById('result-area').classList.remove('show');
    document.getElementById('hint-text').style.display  = '';
    document.getElementById('well-area').style.display  = '';
    document.getElementById('btn-area').style.display   = '';
    syncUI();
  }

  /* Generate stars */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 28; i++) {
    const d = document.createElement('div');
    d.className = 'star';
    d.style.cssText =
      `left:${Math.random() * 100}%;` +
      `top:${Math.random() * 100}%;` +
      `opacity:${0.1 + Math.random() * 0.3};` +
      `width:${1 + Math.random() * 2}px;` +
      `height:${1 + Math.random() * 2}px;` +
      `animation:starTwinkle ${2 + Math.random() * 3}s ease-in-out ${Math.random() * 2}s infinite`;
    starsEl.appendChild(d);
  }

  syncUI();
</script>
</body>
</html>
